<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="小曹工具箱 iPhone 和 iPad App 的隐私政策和联系方法。">
  <title>小曹工具箱 · 隐私与支持</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Inter", system-ui, sans-serif;
      line-height: 1.7;
      --canvas: #faf8f3;
      --ink: #24211c;
      --rule: #ded6c7;
      --link: #8a3d05;
    }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
    }
    main {
      max-width: 40rem;
      margin-inline: auto;
      padding: clamp(2rem, 8vw, 5rem) 1.5rem;
    }
    h1, h2 { line-height: 1.2; }
    h1 { font-size: clamp(2rem, 7vw, 3rem); margin: 0 0 1rem; }
    h2 { font-size: 1.45rem; }
    nav { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; }
    a { color: var(--link); text-underline-offset: 0.18em; overflow-wrap: anywhere; }
    section { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #211e19;
        --ink: #f3eadb;
        --rule: #514637;
        --link: #ffc17f;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>小曹工具箱</h1>
      <nav aria-label="页面导航">
        <a href="#privacy">隐私政策</a>
        <a href="#support">App 支持</a>
      </nav>
    </header>

    <section id="privacy" aria-labelledby="privacy-heading">
      <h2 id="privacy-heading">隐私政策</h2>
      <p>小曹工具箱的骰子工具无需注册或登录。骰子在设备上生成结果，App 不收集、上传或向第三方共享掷骰记录。App 内没有广告或第三方分析工具，也不收集个人数据。</p>
      <p>最近的掷骰结果只保留在当前骰子页面的内存中。你可以在「最近记录」中清空结果，离开骰子页面时也会清空。</p>
      <p>如果你通过支持邮箱联系我们，我们会使用你主动提供的邮箱和邮件内容处理反馈。你可以通过同一地址请求删除支持邮件。</p>
    </section>

    <section id="support" aria-labelledby="support-heading">
      <h2 id="support-heading">App 支持</h2>
      <p>遇到问题或有功能建议，可发邮件到 <a href="mailto:l280001404@163.com">l280001404@163.com</a>。</p>
      <p>反馈问题时，可以附上设备型号、系统版本和复现步骤。</p>
    </section>
  </main>
</body>
</html>
